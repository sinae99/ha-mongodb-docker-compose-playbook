services:
  mongo1:
    image: mongo:7
    container_name: mongo1
    hostname: mongo1
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --oplogSize
      - "2048"
    ports:
      - "27017:27017"
    networks:
      - mongo-ha-net
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27017 --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  mongo2:
    image: mongo:7
    container_name: mongo2
    hostname: mongo2
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --oplogSize
      - "2048"
    ports:
      - "27018:27017"
    networks:
      - mongo-ha-net
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27017 --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  mongo3:
    image: mongo:7
    container_name: mongo3
    hostname: mongo3
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --oplogSize
      - "2048"
    ports:
      - "27019:27017"
    networks:
      - mongo-ha-net
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27017 --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  mongo-ha-net:
    name: mongo-ha-net
